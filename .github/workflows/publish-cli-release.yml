name: Publish CLI release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish CLI
        run: dotnet publish src/PuppyWorkbooks/5-Presentation/CLI/PuppyWorkbooks.CLI/PuppyWorkbooks.CLI.csproj --configuration Release --output artifacts/puppyworkbooks-cli

      - name: Package CLI
        run: cd artifacts/puppyworkbooks-cli && zip -r ../puppyworkbooks-cli.zip .

      - name: Upload CLI to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/puppyworkbooks-cli.zip --repo "${{ github.repository }}"